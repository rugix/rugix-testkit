# Debian system for `generic-grub-efi` targets that the testkit's `vm` fixture
# can log into via SSH.
parent = "core/debian-trixie"

recipes = [
    "core/debian-grub-setup",
    # Child layers cannot add recipes depending on `core/rugix-ctrl` because it
    # fails when it runs twice.
    "core/rugix-ctrl-daemon",
    "core/ssh",
    "network",
]

# Install the Rugix Ctrl build mounted into the Bakery container.
[parameters."core/rugix-ctrl"]
version = "container"
